# SPA static hosting + reverse proxy to the Flask backend.
# Inside docker-compose, "backend" resolves via Docker's embedded DNS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for the JS/CSS bundles
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API calls → Flask backend (gunicorn on port 5001).
    # The variable + resolver form makes nginx re-resolve the upstream
    # so the frontend survives backend container restarts/recreations.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_backend http://backend:5001;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React Router: always fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
