name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Flask)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile check
        run: python -m compileall backend src

      - name: App factory smoke test
        run: |
          python -c "from backend.app import create_app; app = create_app(); print('Flask app created OK:', sorted({r.rule for r in app.url_map.iter_rules()}))"

  frontend:
    name: Frontend (Vite/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No package-lock.json is committed, so npm ci cannot be used.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

  docker:
    name: Docker images (full stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build both images
        run: docker compose build

      - name: Boot the stack and verify health
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5001/api/health > /dev/null 2>&1; then
              echo "Backend healthy after ${i} checks"; break
            fi
            [ "$i" -eq 30 ] && { echo "Backend never became healthy"; docker compose logs; exit 1; }
            sleep 2
          done
          curl -fsS http://localhost:8080/ > /dev/null
          echo "Frontend serving OK"

      - name: Tear down
        if: always()
        run: docker compose down -v
