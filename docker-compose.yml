# Full-stack deployment for the Traffic Forecast platform.
#
#   docker compose up --build     → frontend http://localhost:8080
#                                   backend  http://localhost:5001
#
# Optional API keys (OpenWeather / OpenRouteService) are picked up from
# your shell environment or a .env file next to this file. The app falls
# back to synthetic data when they are unset.

name: traffic-forecast

services:
  backend:
    build:
      context: .            # repository root — needs model/ and dataset/
      dockerfile: backend/Dockerfile
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5001
      FLASK_DEBUG: "false"
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
    ports:
      - "5001:5001"
    volumes:
      # Persist the SQLite prediction-history DB across container restarts.
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
